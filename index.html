<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket - University Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <h1>CampusMarket</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Login</a></li>
                <li><a href="#">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="hero">
            <h2>Welcome to CampusMarket</h2>
            <p>Buy and sell items within your university community.</p>
            <a href="#" class="btn">Browse Products</a>
        </section>

        <!-- Placeholder for products -->
        <section class="product-grid">
            <h3>Featured Products</h3>
            <div class="product-card">
                <img src="images/placeholder.jpg" alt="Product 1">
                <h4>Used Textbook</h4>
                <p>$25.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="images/placeholder.jpg" alt="Product 2">
                <h4>Desk Lamp</h4>
                <p>$15.00</p>
                <button>Add to Cart</button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 CampusMarket. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
